# Configuration for the MBank ATM synthetic dataset generator.
# All high-level knobs live here; detailed behavioural profiles (hourly curves,
# intensity factors) live in the generator modules and are tuned later.

seed: 42

period:
  start: "2024-01-01"
  end: "2025-12-31"          # 731 days, leap year 2024

network:
  n_atms: 120
  # Share of ATMs that are commissioned *during* the period (rest exist from day 1).
  installed_during_period_share: 0.12
  # Year-2 expansion: new ATMs are biased towards the start of year 2.

customers:
  n_customers: 550000
  n_cards: 700000
  multi_card_share: 0.22       # fraction of customers holding 2+ cards
  # Off-us cards (other banks / tourists) are generated on the fly at
  # transaction time and are NOT part of dim_card.

# ATM location archetypes (hidden type that drives behaviour). Shares sum to 1.
atm_types:
  transport_market: 0.18
  office_business:  0.15
  residential:      0.22
  shopping_mall:    0.12
  tourist_center:   0.08
  pension_social:   0.13
  highway_gas:      0.12

# Intensity model (generator/intensity.py). Only high-level knobs live here;
# the hourly/weekly shapes and calendar boosts are defined in the module.
intensity:
  volume_scale: 0.52           # global λ multiplier to hit the ~12M target volume
  profile_jitter: 0.28         # per-ATM shape jitter on H/D → within-type spread (§9.10)
  daily_noise_sigma: 0.20      # sigma of the lognormal day multiplier ε (Cox jitter)
  trend_year2_uplift: 0.12     # net volume growth reached by the end of year 2
  nb_dispersion: 8.0           # NegBinomial dispersion r (higher -> closer to Poisson)

# Cash management (generator/cash_ops.py, TZ §6).
cash:
  low_cash_fraction: 0.25      # replenish when balance drops below this share
  max_refill_lag_days: 1       # crew arrival lag; longer lag → more out_of_cash

# Anomaly injection (generator/anomalies.py, TZ §7). Kept modest (~0.1-1%).
anomalies:
  network_fault:
    events_per_atm_year: 3       # random downtime windows (91/92/96)
    max_duration_hours: 8
  stuck_terminal:
    events_total: 15             # flatline windows across the network
    max_duration_hours: 12
  fraud_skimming:
    n_atms_affected: 6           # ATMs hit by a skimming burst
    bursts_per_atm: 3
    txns_per_burst: 12
  geo_impossible:
    n_cases: 20                  # one card on far ATMs within minutes

calendar:
  # USD/KGS exchange rate model (synthetic in v1, replaced by real series later).
  fx:
    base_rate: 89.0            # approx USD/KGS at start of 2024
    daily_vol: 0.0008          # std of daily log-returns (KGS is fairly stable)
    drift_per_year: 0.01       # mild depreciation
    shock_prob: 0.01           # probability of a shock day
    shock_size: 0.012          # magnitude of a shock (fractional jump)
  weather:
    # Monthly climatology of Bishkek (mean temp °C, relative precip 0..1).
    # Used to synthesise daily temp/precip; replaced by real data later.
    source: synthetic

output:
  data_dir: "data"
  meta_dir: "meta"
  write_csv_mirror: true       # also write small dim tables as CSV for readability
